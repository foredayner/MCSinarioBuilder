name: bench

# Real AI on the test scenario: the town's architecture guide and a few buildings, with pictures.
# Needs the ANTHROPIC_API_KEY repository secret. Start it from the Actions tab (Run workflow)
# or by pushing to the "bench" branch. Results go to the bench-results branch.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id for the guide and the buildings
        default: claude-haiku-5-5
      sheet:
        description: Test sheet (greymouth = 1920s harbour town, modern_korea = modern Korean street, e2e = the whole way from the scenario text)
        default: greymouth
      places:
        description: Comma-separated place ids (empty = every place of the sheet)
        default: ""
  push:
    branches: [bench]

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the key is there
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::ANTHROPIC_API_KEY secret is missing"; exit 1; fi
          echo "key present (${#ANTHROPIC_API_KEY} chars)"
      - name: Get the AI Build Assistant (required mod)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          gh release download mc1.21.4-latest -R foredayner/McTestBuilder -p '*.jar' -D libs-dl --clobber
          mv "$(ls libs-dl/*.jar | grep -v sources | head -1)" libs/minecraft-ai-build-assistant.jar
      - name: Get a reference photo (Korean police box, Wikimedia Commons)
        if: ${{ (github.event.inputs.sheet || 'greymouth') == 'modern_korea' }}
        run: |
          mkdir -p build/clientgametest
          for name in Seoul_Nowon_Police_Station_Danghyeon_Police_Box.JPG Gapyeong_Police_Station_Eumnae_Police_Box.JPG Jangheung_Police_Station_Eumnae_Police_Box.JPG; do
            if curl -sfL -A "MCSinarioBuilder-bench/1.0 (https://github.com/foredayner/MCSinarioBuilder)" \
                 -o build/clientgametest/ref_police.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/${name}?width=1024" \
               && [ "$(head -c 2 build/clientgametest/ref_police.jpg | od -An -tx1 | tr -d ' ')" = "ffd8" ]; then
              echo "photo: ${name} ($(stat -c %s build/clientgametest/ref_police.jpg) bytes)"
              echo "${name}" > build/clientgametest/ref_police.txt
              break
            fi
            rm -f build/clientgametest/ref_police.jpg
          done
      - name: Run the bench in a real client
        id: bench
        continue-on-error: true
        uses: modmuss50/xvfb-action@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCN_BENCH_ONLY: "1"
          SCN_BENCH_MODEL: ${{ github.event.inputs.model || 'claude-haiku-5-5' }}
          SCN_BENCH_SHEET: ${{ github.event.inputs.sheet || 'greymouth' }}
          SCN_BENCH_E2E: ${{ (github.event.inputs.sheet || 'greymouth') == 'e2e' && 'greymouth' || '' }}
          SCN_BENCH_PLACES: ${{ github.event.inputs.places || '' }}
          SCN_BENCH_REF: ${{ (github.event.inputs.sheet || 'greymouth') == 'modern_korea' && 'police=ref_police.jpg' || '' }}
        with:
          run: |
            chmod +x gradlew
            mkdir -p build/clientgametest
            echo "eula=true" > build/clientgametest/eula.txt
            ./gradlew runClientGametest --stacktrace
      - name: Publish results to the bench-results branch
        if: always()
        run: |
          out=$(mktemp -d)
          cp -r build/clientgametest/bench "$out/" 2>/dev/null || true
          cp -r build/clientgametest/screenshots "$out/" 2>/dev/null || true
          if [ -d "$out/bench/world" ]; then (cd "$out/bench" && zip -qr town_world.zip world && rm -rf world); fi
          mkdir -p "$out/bench"; cp build/clientgametest/ref_police.jpg build/clientgametest/ref_police.txt "$out/bench/" 2>/dev/null || true
          mkdir -p "$out/logs"
          # Never publish the key: drop any line that could contain it.
          grep -v -i "x-api-key\|authorization\|sk-ant" build/clientgametest/logs/latest.log > "$out/logs/client.log" 2>/dev/null || true
          echo "${GITHUB_SHA} bench=${{ steps.bench.outcome }} model=${{ github.event.inputs.model || 'claude-haiku-5-5' }} sheet=${{ github.event.inputs.sheet || 'greymouth' }}" > "$out/RUN.txt"
          cd "$out"
          git init -q
          git checkout -q -b bench-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "bench for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bench-results
